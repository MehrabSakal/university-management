name: University Management System Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit-tests:
    name: Unit Tests (6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run 6 unit tests
        run: mvn --batch-mode --no-transfer-progress test
      - name: Publish unit test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit Test Results (Controller, Model, Security)
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  integration-tests:
    name: Integration Tests (2)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run 2 integration tests
        run: mvn --batch-mode --no-transfer-progress -Dskip.unit.tests=true verify
      - name: Publish integration test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Integration Test Results
          path: '**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: '**/target/failsafe-reports/'
          if-no-files-found: ignore
